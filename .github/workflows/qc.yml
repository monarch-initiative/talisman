name: ontogpt QC

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.9", "3.10" ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # snok/install-poetry@v1.3.1 no longer leaves poetry on the PATH.
      - name: Install Poetry
        run: pipx install poetry==2.1.3
      - name: Install dependencies
        run: |
          poetry env use python
          poetry install --no-interaction

      - name: Run linter
        run: poetry run tox -e lint

      - name: Check code quality with flake8
        run: poetry run tox -e flake8
#       - name: Check package metadata with Pyroma
#         run: poetry run tox -e pyroma
      - name: Check static typing with MyPy
        run: poetry run tox -e mypy

      - name: Unit tests only
        run: poetry run python -m unittest discover tests.unit
