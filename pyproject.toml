[project]
name = "talisman"
version = "0.0.1"
description = "TALISMAN"
authors = [{ name = "Marcin Joachimiak" }]
license = "BSD-3-Clause"
readme = "README.md"
requires-python = ">=3.9,!=3.9.7,<4.0"
dependencies = [
    # talisman uses ontogpt 0.3.6 internals (clients, MODELS, prompts, the enrichment
    # engine and evaluator), which later releases change: test before relaxing this pin.
    "ontogpt==0.3.6",
    # eutils, which oaklib imports, needs pkg_resources, which setuptools 82 removed.
    "setuptools<82",
]

[project.scripts]
talisman = "talisman.cli:main"

[dependency-groups]
dev = [
    "jupyter>=1.0.0,<2",
    "mkdocs-mermaid2-plugin>=0.6.0",
    "papermill>=2.4.0,<3",
    "pytest>=7.1.2",
    "seaborn>=0.12.2,<0.13",
    "setuptools>=65.5.0",
    "tox>=3.25.1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# Ship only the package, as Poetry did. By default hatchling packs every file that git
# doesn't ignore, untracked ones included (local caches, scratch notebooks).
include = ["/src"]

[tool.uv]
# The locked semsimian 0.2.11 (via oaklib) has wheels only for CPython 3.9-3.11, and no sdist.
environments = ["python_version < '3.12'"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310"]

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 100
include_trailing_comma = true
reverse_relative = true
